<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111418" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>鬼計算</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header id="bar">
      <div class="stat"><span class="label">レベル</span><span id="level">1バック</span></div>
      <div class="stat" id="timerWrap"><span class="label">じかん</span><span id="timer">0:00</span></div>
      <div class="stat"><span class="label">ベスト</span><span id="best">1バック</span></div>
    </header>

    <!-- progress within the current 22-problem set -->
    <div id="progress"><div id="progressFill"></div></div>

    <!-- the CURRENT problem (to memorize) -->
    <section id="problem">
      <span id="qa">3</span>
      <span id="op">+</span>
      <span id="qb">4</span>
    </section>

    <!-- what to write right now -->
    <p id="instruct">おぼえてね</p>

    <!-- handwriting canvas -->
    <section id="padWrap">
      <canvas id="pad"></canvas>
      <div id="verdict"></div>
      <div id="memoBadge">おぼえる</div>
    </section>

    <footer id="controls">
      <button id="clearBtn" class="btn">けす</button>
      <button id="passBtn" class="btn pass">パス</button>
      <button id="nextBtn" class="btn primary">つぎへ ▶</button>
    </footer>

    <!-- toast between sets -->
    <div id="toast"></div>

    <!-- start / result overlay -->
    <div id="overlay" class="overlay">
      <h1>鬼計算</h1>
      <p id="overlayMsg">いま出る計算は<b>おぼえるだけ</b>。<br>
こたえを書くのは<b>Nつ前</b>の計算。<br>
1バックから始まり、できると<br>
2・3バック…と<b>むずかしくなる</b>。</p>
      <button id="startBtn" class="btn primary">スタート</button>
      <p class="hint">5分やったら、そのセットの終わりで終了。<br>こたえ(0〜9)は ゆびで手書き。</p>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
